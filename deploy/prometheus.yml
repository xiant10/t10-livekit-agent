# Scrapes the otel-collector's prometheus exporter (see
# otel-collector-config.yaml), which is where agent/client OTLP metrics
# (internal/telemetry's t10.stage.* instruments) end up. Query at
# http://localhost:9090.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
